# .github/workflows/secret-scan.yml
#
# Run gitleaks on every push and PR to fail the build when a known secret
# pattern (AWS keys, Stripe keys, GitHub PATs, generic high-entropy strings,
# private keys, etc.) lands in the diff or in history.
#
# Why a separate workflow: secret findings should fail loudly and independently
# of the rest of CI. Even if `ci.yml` is broken or skipped (paths filter, etc.),
# this still runs.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Also run on a schedule, in case a long-lived branch has accumulated history
  # the original scan missed (gitleaks rules drift forward over time).
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action posts a PR comment with findings; needs PR write.
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # fetch-depth: 0 pulls the full history. gitleaks scans every commit
          # in the diff, not just HEAD. Without this the scan is shallow.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # GITHUB_TOKEN: required for the PR comment + check status.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_NOTIFY_USER_LIST: optional. If set, gitleaks @-mentions
          # the listed users in the PR comment when a finding lands.
          # GITLEAKS_NOTIFY_USER_LIST: '@your-handle'
